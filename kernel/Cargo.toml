[package]
name = "harlan-kernel"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Long heap stress run at boot instead of the quick one (see memory::heap).
heap-stress = []

[dependencies]
harlan-hal = { path = "../hal" }
log = "0.4"

[target.'cfg(target_arch = "x86_64")'.dependencies]
harlan-arch-x86_64 = { path = "../arch/x86_64" }
