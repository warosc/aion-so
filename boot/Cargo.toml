[package]
name = "harlan-boot"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Writes a hardware inventory onto the volume it booted from, before
# leaving Boot Services, and shows it on the screen
# (docs/adr/0035-fase5-hardware-inventory.md). For a stick that goes into a
# machine nobody here has seen.
inventory = []
heap-stress = ["harlan-kernel/heap-stress"]
soak = ["harlan-kernel/soak"]

[dependencies]
harlan-kernel = { path = "../kernel" }
uefi = { version = "0.40.0" }
uefi-raw = "0.16.0"
harlan-hal = { path = "../hal" }
harlan-fbcon = { path = "../drivers/fbcon" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
harlan-arch-x86_64 = { path = "../arch/x86_64" }
