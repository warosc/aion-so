[package]
name = "harlan-boot"
version.workspace = true
edition.workspace = true
publish = false

[features]
heap-stress = ["harlan-kernel/heap-stress"]
soak = ["harlan-kernel/soak"]

[dependencies]
harlan-kernel = { path = "../kernel" }
uefi = { version = "0.40.0" }
uefi-raw = "0.16.0"
harlan-hal = { path = "../hal" }
harlan-fbcon = { path = "../drivers/fbcon" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
harlan-arch-x86_64 = { path = "../arch/x86_64" }
