[package]
name = "aion-fbcon"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aion-hal = { path = "../../hal" }
# Data-only dependency (one ~1 KiB glyph table). `default-features = false`
# is what makes it `no_std`: the crate's default `std` feature would not
# build for the freestanding/UEFI targets.
font8x8 = { version = "0.3.1", default-features = false }
