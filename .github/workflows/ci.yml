name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy -p harlan-hal -p harlan-arch-x86_64 -p harlan-fbcon -p harlan-kernel -p xtask --all-targets -- -D warnings
      - run: cargo clippy -p harlan-kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p harlan-boot --target x86_64-unknown-uefi -- -D warnings
      - run: cargo clippy -p harlan-hello --target x86_64-unknown-none -- -D warnings

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p harlan-hal -p harlan-arch-x86_64 -p harlan-fbcon -p harlan-kernel -p xtask

  build-freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build -p harlan-kernel --target x86_64-unknown-none --release
      - run: cargo build -p harlan-boot --target x86_64-unknown-uefi --release
      - run: cargo build -p harlan-hello --target x86_64-unknown-none --release

  # A second opinion on the disk image, from an implementation nobody here
  # wrote. A FAT32 reader and the formatter that made the image it reads
  # pass each other's tests even when both are wrong; `fsck.vfat` does not
  # share the misunderstanding (docs/adr/0025-fase4-fat32-read-only.md).
  disk-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install dosfstools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools
      - run: cargo xtask build
      # `-n` is "no changes": report what is wrong and fix nothing. `-V`
      # makes it verify by reading the whole volume back.
      - run: fsck.vfat -n -V target/disk.img

  boot-smoke-test:
    needs: build-freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install QEMU and dosfstools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 dosfstools
      - run: cargo xtask boot-test --timeout-secs 30 --repeat 10
      # Straight after those ten boots and before anything else runs. Each
      # `boot-test` builds first, and building lays the disk out again, so
      # a check placed after the next one would see a single boot's writes
      # and say so as if it had seen ten
      # (docs/adr/0027-fase4-fat32-write.md, point 10).
      - name: The disk the kernel wrote is still a FAT32 volume
        run: fsck.vfat -n -V target/disk.img
      # And the event log, read by something that is not this kernel
      # (docs/adr/0031-fase4-system-event-log.md). `mcopy` is dosfstools'
      # neighbour in mtools; if the lines are not whole lines, or the ten
      # boots are not all in there, this is where it shows.
      - name: The event log is ten boots of whole lines
        run: |
          sudo apt-get install -y mtools
          mcopy -i target/disk.img ::EVENTS.LOG events.log
          echo "--- the last twelve lines ---"
          tail -n 12 events.log
          # Every line is `<boot> <ticks> <word> ...`, and the file ends
          # where a line ends. A log that stops mid-line lies about the
          # last event it holds.
          [ -s events.log ] || { echo "the log is empty"; exit 1; }
          [ "$(tail -c 1 events.log | xxd -p)" = "0a" ] || {
            echo "the log does not end at a line break"; exit 1; }
          grep -qE '^ +10 +[0-9]+ boot +10$' events.log || {
            echo "boot 10 is not in the log"; exit 1; }
          grep -vqE '^ +[0-9]+ +[0-9]+ [a-z-]+ ' events.log && {
            echo "a line is not in the format"; exit 1; } || true
          echo "lines: $(wc -l < events.log)"
      # Quoted: an unquoted ": " inside the marker would break the YAML.
      - run: 'cargo xtask boot-test --timeout-secs 120 --heap-stress --marker "HARLAN: heap stress complete, 200000 cycles"'

  soak-test:
    needs: build-freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - run: cargo xtask soak-test --duration-secs 120 --min-ticks 10000 --min-heap-cycles 50000
