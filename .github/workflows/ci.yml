name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy -p aion-hal -p aion-arch-x86_64 -p aion-kernel -p xtask --all-targets -- -D warnings
      - run: cargo clippy -p aion-kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p aion-boot --target x86_64-unknown-uefi -- -D warnings

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p aion-hal -p aion-arch-x86_64 -p aion-kernel -p xtask

  build-freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build -p aion-kernel --target x86_64-unknown-none --release
      - run: cargo build -p aion-boot --target x86_64-unknown-uefi --release

  boot-smoke-test:
    needs: build-freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - run: cargo xtask boot-test --timeout-secs 30 --repeat 10
